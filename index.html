<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إرسال إلى تيلغرام</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #203a43;
            margin-bottom: 0.5rem;
        }
        .sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 1.5rem;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #0088cc;
            outline: none;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background: #006699;
            transform: scale(1.02);
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 12px;
            display: none;
            font-size: 14px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        hr {
            margin: 20px 0;
        }
        .note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📨 أرسل رسالة لبوتك</h1>
    <div class="sub">سيتم إرسال النص مباشرة إلى تيلغرام</div>

    <form id="sendForm">
        <input type="text" id="userMessage" placeholder="✏️ اكتب أي شيء هنا..." autocomplete="off">
        <button type="submit">🚀 إرسال إلى البوت</button>
    </form>

    <div id="status"></div>
    <hr>
    <div class="note">
        ⚠️ للتجربة فقط | سيظهر التوكن في الكود (لا تشارك الملف مع أحد)
    </div>
</div>

<script>
    // ============================================================
    // 🔻🔻🔻 ضع التوكن و ID الخاصين بك هنا 🔻🔻🔻
    // ============================================================
    
    const BOT_TOKEN = "8920328815:AAEOP0sR3Jc98i0osmfnh9t21m3WGusW2FA"
    const CHAT_ID   = "8416078700"
    
    // ============================================================
    // لا تغير أي شيء بعد هذا السطر
    // ============================================================

    const form = document.getElementById('sendForm');
    const messageInput = document.getElementById('userMessage');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const text = messageInput.value.trim();
        if (!text) {
            showStatus("❌ الرجاء كتابة رسالة أولاً", "error");
            return;
        }

        // التحقق من أن المستخدم وضع التوكن و ID
        if (BOT_TOKEN === "ضع_توكن_البوت_هنا" || CHAT_ID === 8416078700) {
            showStatus("8920328815:AAEOP0sR3Jc98i0osmfnh9t21m3WGusW2FA);
            return;
        }

        showStatus("⏳ جاري الإرسال...", "info");

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const params = new URLSearchParams();
        params.append('chat_id', CHAT_ID);
        params.append('text', `📩 رسالة جديدة من الموقع:\n\n${text}`);

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params
            });

            const result = await response.json();
            
            if (result.ok) {
                showStatus("✅ تم الإرسال بنجاح إلى تيلغرام!", "success");
                messageInput.value = '';
            } else {
                showStatus("❌ فشل الإرسال: " + (result.description || "خطأ غير معروف"), "error");
            }
        } catch (error) {
            showStatus("❌ خطأ في الاتصال: " + error.message, "error");
        }
    });

    function showStatus(msg, type) {
        statusDiv.style.display = "block";
        statusDiv.textContent = msg;
        statusDiv.className = type === "success" ? "success" : (type === "error" ? "error" : "info");
        
        if (type !== "info") {
            setTimeout(() => {
                statusDiv.style.display = "none";
            }, 5000);
        }
    }
</script>

</body>
</html>
