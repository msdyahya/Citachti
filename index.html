<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدونتي من تيليغرام</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .post {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .post-title {
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .post-content {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>📝 منشوراتي من تيليغرام</h1>
    <div id="posts">⏳ جاري تحميل المنشورات...</div>

    <script>
        const GITHUB_USERNAME = 'msdyahya';
        
        async function loadPosts() {
            try {
                const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/gists`);
                const gists = await response.json();
                
                const container = document.getElementById('posts');
                
                if (gists.length === 0) {
                    container.innerHTML = '<p>✨ لا توجد منشورات بعد. انشر في قناتك على تيليغرام!</p>';
                    return;
                }
                
                let html = '';
                for (const gist of gists) {
                    const firstFile = gist.files[Object.keys(gist.files)[0]];
                    const contentResponse = await fetch(firstFile.raw_url);
                    const content = await contentResponse.text();
                    
                    html += `
                        <div class="post">
                            <div class="post-title">📢 ${escapeHtml(gist.description || 'منشور جديد')}</div>
                            <div class="post-content">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                            <small>📅 ${new Date(gist.created_at).toLocaleDateString('ar-EG')}</small>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
            } catch(error) {
                document.getElementById('posts').innerHTML = '<p>❌ خطأ في تحميل المنشورات</p>';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadPosts();
    </script>
</body>
</html>
